name: llm-error-classifier

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b12352@sha256:998e17af1ae710081e5a6e6db962f29dd81db31b33eccf281f1767ff0f7729c7
    environment:
      LLAMA_ARG_HF_REPO: ${LLAMA_ARG_HF_REPO:?LLAMA_ARG_HF_REPO is not set, copy .env.example to .env}
      LLAMA_ARG_HF_FILE: ${LLAMA_ARG_HF_FILE:?LLAMA_ARG_HF_FILE is not set, copy .env.example to .env}
      LLAMA_ARG_ALIAS: ${MODEL_ALIAS:?MODEL_ALIAS is not set, copy .env.example to .env}
      LLAMA_CACHE: /models
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_CTX_SIZE: ${LLAMA_ARG_CTX_SIZE:-8192}
      LLAMA_ARG_N_PARALLEL: ${LLAMA_ARG_N_PARALLEL:-2}
      LLAMA_ARG_THREADS: ${LLAMA_ARG_THREADS:-6}
      LLAMA_ARG_BATCH: ${LLAMA_ARG_BATCH:-512}
      LLAMA_ARG_MMPROJ_AUTO: ${LLAMA_ARG_MMPROJ_AUTO:-off}
      LLAMA_ARG_ENDPOINT_METRICS: ${LLAMA_ARG_ENDPOINT_METRICS:-1}
      LLAMA_ARG_OFFLINE: ${LLAMA_ARG_OFFLINE:-0}
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: ${LLM_START_PERIOD:-1800s}
    cpus: ${LLM_CPUS:-6}
    mem_limit: ${LLM_MEM_LIMIT:-6g}
    memswap_limit: ${LLM_MEM_LIMIT:-6g}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    logging: *logging

  api:
    build: .
    image: llm-error-classifier-api:local
    environment:
      LLM_BASE_URL: http://llm:8080/v1
      LLM_MODEL: ${MODEL_ALIAS:?MODEL_ALIAS is not set, copy .env.example to .env}
      LLM_PROBE_TIMEOUT_S: ${LLM_PROBE_TIMEOUT_S:-2.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUEST_TIMEOUT_S: ${REQUEST_TIMEOUT_S:-120}
      MAX_CONCURRENCY: ${LLAMA_ARG_N_PARALLEL:-2}
      MAX_QUEUE: ${MAX_QUEUE:-4}
      QUEUE_TIMEOUT_S: ${QUEUE_TIMEOUT_S:-30}
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-3000}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-262144}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-256}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.0}
      API_KEY: ${API_KEY:-}
      LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:?LLM_DISABLE_THINKING is not set, copy .env.example to .env}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: ${API_CPUS:-1}
    mem_limit: ${API_MEM_LIMIT:-512m}
    memswap_limit: ${API_MEM_LIMIT:-512m}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    logging: *logging

volumes:
  models:
